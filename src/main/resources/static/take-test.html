<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Take Test - ITS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <a href="index.html" class="text-blue-500 hover:underline mb-4 inline-block">← Back to Assessments</a>
        <h1 class="text-3xl font-bold mb-8">Take Test</h1>

        <div class="bg-white p-6 rounded-lg shadow-lg max-w-3xl mx-auto">
            <div class="mb-6">
                <label class="block text-sm font-medium mb-2">Student ID</label>
                <input type="text" id="studentId" placeholder="Enter your student ID"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md" />
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium mb-2">Select Assessment</label>
                <select id="assessmentSelect" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                    <option value="">-- Choose Assessment --</option>
                </select>
            </div>

            <div id="testContainer" class="hidden">
                <h2 id="testTitle" class="text-2xl font-bold mb-4"></h2>
                <form id="testForm">
                    <div id="questionsList" class="space-y-6"></div>
                    <div class="flex gap-4 mt-6">
                        <button type="submit"
                            class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md">Submit
                            Test</button>
                        <button type="button" id="cancelBtn"
                            class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-md">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="resultContainer" class="bg-white p-6 rounded-lg shadow-lg max-w-3xl mx-auto mt-6 hidden">
            <h2 class="text-2xl font-bold mb-4">Test Result</h2>
            <p id="resultScore" class="text-lg mb-4"></p>
            <button onclick="location.href='index.html'"
                class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md">Back to Home</button>
        </div>
    </div>

    <script src="take-test.js"></script>
</body>

</html>
